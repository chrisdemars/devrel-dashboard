name: Feature request
description: Suggest a change or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        To ask for a new data source connector, use the "New data source" form instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: Describe the change. Use made-up examples ("Acme"), not real company names or data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you considered.
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I can open a pull request for this.
          required: false
