name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include API keys, tokens, service account files or real data anywhere in this form.
        For a security problem, do not use this form. Follow the security policy instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran or the pages you opened, in order.
      placeholder: |
        1. Run `npm run collect`
        2. Open http://localhost:3000
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error message, if there is one.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of npm run status
      description: Only if the bug involves a data source or the collector. Remove secrets, account ids and real organization names before you paste it.
      render: text
    validations:
      required: false
  - type: input
    id: node
    attributes:
      label: Node version
      description: The output of `node --version`.
      placeholder: v22.12.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD`.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I removed all secrets and real data from this report.
          required: true
